services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: petcare
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: ${PETCARE_DB_PASSWORD}
    volumes:
      - petcare_postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8081
      PETCARE_DB_URL: jdbc:postgresql://database:5432/petcare
      PETCARE_DB_USER: petcare
      PETCARE_DB_PASSWORD: ${PETCARE_DB_PASSWORD}
    ports:
      - "${PETCARE_PUBLIC_PORT:-8081}:8081"

volumes:
  petcare_postgresql:
